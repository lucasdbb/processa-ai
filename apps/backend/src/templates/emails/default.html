<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; line-height: 1.6; color: #333; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        .header { background-color: #0f172a; color: white; padding: 30px 20px; text-align: center; }
        .header h1 { margin: 0; font-size: 24px; font-weight: 600; letter-spacing: 1px; }
        .content { padding: 40px 30px; }
        .title { font-size: 22px; color: #0f172a; margin-bottom: 20px; font-weight: 600; }
        .subtitle { font-size: 18px; color: #475569; margin-bottom: 15px; font-weight: 500; }
        .text { color: #334155; margin-bottom: 20px; font-size: 16px; white-space: pre-line; }
        .button-container { text-align: center; margin: 30px 0; }
        .button { display: inline-block; background-color: #2563eb; color: white; padding: 14px 28px; text-decoration: none; border-radius: 6px; font-weight: 600; font-size: 16px; transition: background-color 0.3s; }
        .button:hover { background-color: #1d4ed8; }
        .footer { background-color: #f8fafc; padding: 20px; text-align: center; font-size: 13px; color: #64748b; border-top: 1px solid #e2e8f0; }
        .footer p { margin: 5px 0; }
        .link { color: #2563eb; text-decoration: none; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Processa AI</h1>
        </div>
        <div class="content">
            <h2 class="title">{{Titulo}}</h2>
            
            <div class="text">
                {{Conteudo}}
            </div>
            
            <!-- Botão Condicional (será removido via código se não houver link) -->
            {{Botao_HTML}}
        </div>
        <div class="footer">
            <p>Atenciosamente,<br>Equipe Processa AI</p>
            <p>&copy; 2026 Processa AI. Todos os direitos reservados.</p>
        </div>
    </div>
</body>
</html>
