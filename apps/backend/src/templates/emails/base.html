<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Processa AI{% endblock %}</title>
    <!--[if mso]>
    <style type="text/css">
    body, table, td {font-family: Arial, Helvetica, sans-serif !important;}
    </style>
    <![endif]-->
    <style>
        /* Reset styles */
        body { margin: 0; padding: 0; background-color: #f4f4f5; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; -webkit-font-smoothing: antialiased; line-height: 1.6; color: #334155; }
        table { border-spacing: 0; border-collapse: collapse; mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { border: 0; display: block; max-width: 100%; height: auto; }
        a { text-decoration: none; color: #0f3366; }
        
        /* Container */
        .wrapper { width: 100%; table-layout: fixed; background-color: #f4f4f5; padding-bottom: 40px; }
        .main { background-color: #ffffff; margin: 0 auto; width: 100%; max-width: 600px; border-radius: 8px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06); }
        
        /* Typography */
        h1 { color: #0f3366; font-size: 24px; margin: 0 0 10px 0; font-weight: 800; text-align: center; letter-spacing: -0.5px; }
        h2 { color: #0f3366; font-size: 20px; margin: 20px 0 15px 0; font-weight: 700; text-align: center; }
        p { margin: 0 0 16px 0; font-size: 16px; color: #475569; }
        
        /* Components */
        .header { padding: 40px 20px 20px 20px; text-align: center; background-color: #ffffff; }
        .content { padding: 20px 40px 40px 40px; }
        
        .btn { 
            display: inline-block; 
            background-color: #0f3366; 
            color: #ffffff !important; 
            padding: 12px 28px; 
            border-radius: 6px; 
            font-weight: 600; 
            font-size: 14px; 
            text-decoration: none; 
            margin-top: 10px; 
            transition: background-color 0.2s;
        }
        .btn:hover { background-color: #1e40af; }
        
        .footer { 
            background-color: #f8fafc; 
            padding: 40px; 
            text-align: center; 
            border-top: 1px solid #e2e8f0; 
            color: #94a3b8; 
            font-size: 13px;
        }
        .footer a { color: #64748b; text-decoration: underline; }
        
        /* Mobile Responsiveness */
        @media screen and (max-width: 600px) {
            .main { width: 100% !important; border-radius: 0; }
            .content { padding: 20px 20px 40px 20px; }
            .header { padding: 30px 20px 10px 20px; }
            h1 { font-size: 22px; }
        }

        /* Custom Styles Injection */
        {% block styles %}{% endblock %}
    </style>
</head>
<body>
    <center class="wrapper">
        <table class="main" width="100%" cellpadding="0" cellspacing="0">
            <!-- Header -->
            <tr>
                <td class="header">
                    <a href="https://www.processai.app.br">
                        <img src="{{ EMAIL_LOGO_URL }}" alt="Processa AI" width="220" style="margin: 0 auto;">
                    </a>
                </td>
            </tr>

            <!-- Body -->
            <tr>
                <td class="content">
                    {% block content %}{% endblock %}
                </td>
            </tr>

            <!-- Footer -->
            <tr>
                <td class="footer">
                    <p style="margin-bottom: 8px; color: #64748b;">Atenciosamente,</p>
                    <p style="font-weight: 700; color: #334155; margin-bottom: 24px;">Equipe Processa AI</p>
                    
                    <p style="font-size: 11px; margin-bottom: 12px;">&copy; 2026 Processa AI. Todos os direitos reservados.</p>
                    <p style="font-size: 11px;">
                        {% block unsubscribe %}
                        <a href="{{unsubscribe}}">Cancelar inscrição</a>
                        {% endblock %}
                    </p>
                </td>
            </tr>
        </table>
    </center>
</body>
</html>
