services:
  # =============================================================================
  # INFRASTRUCTURE
  # =============================================================================

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - processa-network

  # n8n - Workflow engine
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Sao_Paulo}
      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-changeme}
      - N8N_NATIVE_PYTHON_RUNNER=true
    volumes:
      - 'D:\Docker\n8n_data:/home/node/.n8n'
    networks:
      - processa-network

  # n8n runners - External task runners
  n8n-runners:
    image: n8nio/runners:latest
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-changeme}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-0}
    networks:
      - processa-network
    depends_on:
      - n8n

  # =============================================================================
  # APPLICATIONS
  # =============================================================================

  # Backend - Unified FastAPI application
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_ANON_KEY=${SUPABASE_ANON_KEY}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_OUTPUTS_BUCKET=${SUPABASE_OUTPUTS_BUCKET}
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      - STRIPE_PRICE_ID_PRO=${STRIPE_PRICE_ID_PRO}
      - STRIPE_PRICE_ID_ENTERPRISE=${STRIPE_PRICE_ID_ENTERPRISE}
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JOBS_QUEUE_KEY=${JOBS_QUEUE_KEY:-jobs}
      - JOB_STATUS_TTL_S=${JOB_STATUS_TTL_S:-86400}
      # n8n
      - N8N_BASE_URL=http://n8n:5678
      - N8N_CNIS_WORKFLOW_ID=${N8N_CNIS_WORKFLOW_ID}
      - N8N_FILE_FIELD_NAME=${N8N_FILE_FIELD_NAME:-data}
      - N8N_AUTH_USER=${N8N_AUTH_USER}
      - N8N_AUTH_PASSWORD=${N8N_AUTH_PASSWORD}
      - N8N_TIMEOUT_S=${N8N_TIMEOUT_S:-120}
      # Google
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI:-http://localhost:8000/api/v1/calendar/callback}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Frontend
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Email
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM=${SENDGRID_FROM}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      # Webhook
      - WEBHOOK_BASE_URL=${WEBHOOK_BASE_URL}
    networks:
      - processa-network
    depends_on:
      - redis

  # =============================================================================
  # SERVICES
  # =============================================================================

  # Worker - Async job processor
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_OUTPUTS_BUCKET=${SUPABASE_OUTPUTS_BUCKET}
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JOBS_QUEUE_KEY=${JOBS_QUEUE_KEY:-jobs}
      - JOB_STATUS_TTL_S=${JOB_STATUS_TTL_S:-86400}
      # n8n
      - N8N_BASE_URL=http://n8n:5678
      - N8N_CNIS_WORKFLOW_ID=${N8N_CNIS_WORKFLOW_ID}
      - N8N_FILE_FIELD_NAME=${N8N_FILE_FIELD_NAME:-data}
      - N8N_AUTH_USER=${N8N_AUTH_USER}
      - N8N_AUTH_PASSWORD=${N8N_AUTH_PASSWORD}
      - N8N_TIMEOUT_S=${N8N_TIMEOUT_S:-120}
      # Google (for office jobs)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Callback
      - AI_WORKER_CALLBACK_BASE_URL=http://backend:8000
      - PORT=8001
    networks:
      - processa-network
    depends_on:
      - redis
      - n8n
    deploy:
      replicas: 1  # Can be scaled horizontally

networks:
  processa-network:
    driver: bridge
