services:
  # =============================================================================
  # APPLICATIONS
  # =============================================================================

  # Frontend - Vite/React application
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8000}
        - VITE_INTERNAL_TOKEN=${VITE_INTERNAL_TOKEN}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    ports:
      - "5173:80"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - processa-network
    depends_on:
      backend:
        condition: service_healthy

  # Backend - Unified FastAPI application
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    environment:
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Internal Auth
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      # Supabase JWT verification
      - SUPABASE_JWT_SECRET=${SUPABASE_JWT_SECRET}
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Google (Calendar Integration)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Frontend
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Gemini (Chat Jurídico + Embeddings RAG)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_CHAT_MODEL=${GEMINI_CHAT_MODEL:-gemini-3.1-flash-lite-preview}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      # Email
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM=${SENDGRID_FROM}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL}
    networks:
      - processa-network

  # =============================================================================
  # SERVICES
  # =============================================================================

  # Worker - Async job processor
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # AI Providers
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      # Gemini (CNIS analysis + RAG embeddings)
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-3.1-pro-preview}
      - GEMINI_EMBEDDING_MODEL=${GEMINI_EMBEDDING_MODEL:-gemini-embedding-001}
      - GEMINI_ENRICHMENT_MODEL=${GEMINI_ENRICHMENT_MODEL:-gemini-3.1-flash-lite-preview}
      # Google (for office jobs)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - PORT=8001
    networks:
      - processa-network
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 2G

networks:
  processa-network:
    driver: bridge
