services:
  # =============================================================================
  # INFRASTRUCTURE
  # =============================================================================

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    networks:
      - processa-network

  # =============================================================================
  # APPLICATIONS
  # =============================================================================

  # Frontend - Vite/React application
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
      args:
        - VITE_BACKEND_URL=${VITE_BACKEND_URL:-http://localhost:8000}
        - VITE_INTERNAL_TOKEN=${VITE_INTERNAL_TOKEN}
        - VITE_SUPABASE_URL=${VITE_SUPABASE_URL}
        - VITE_SUPABASE_ANON_KEY=${VITE_SUPABASE_ANON_KEY}
    ports:
      - "5173:80"
    networks:
      - processa-network
    depends_on:
      - backend

  # Backend - Unified FastAPI application
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - ENVIRONMENT=${ENVIRONMENT:-development}
      # Internal Auth
      - INTERNAL_TOKEN=${INTERNAL_TOKEN}
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Stripe
      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}
      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JOBS_QUEUE_KEY=${JOBS_QUEUE_KEY:-jobs}
      - JOB_STATUS_TTL_S=${JOB_STATUS_TTL_S:-86400}
      # Google (Calendar Integration)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # Frontend
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:5173}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:3000}
      # Email
      - SENDGRID_API_KEY=${SENDGRID_API_KEY}
      - SENDGRID_FROM=${SENDGRID_FROM}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL}
    networks:
      - processa-network
    depends_on:
      - redis

  # =============================================================================
  # SERVICES
  # =============================================================================

  # Worker - Async job processor
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    environment:
      # Database
      - DATABASE_URL=${DATABASE_URL}
      # Supabase
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      # Redis
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JOBS_QUEUE_KEY=${JOBS_QUEUE_KEY:-jobs}
      - JOB_STATUS_TTL_S=${JOB_STATUS_TTL_S:-86400}
      # AI Providers
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY}
      - LLM_MODEL=${LLM_MODEL:-gpt-4.1-mini}
      # Google (for office jobs)
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - PORT=8001
    networks:
      - processa-network
    depends_on:
      - redis
    deploy:
      replicas: 1  # Can be scaled horizontally

networks:
  processa-network:
    driver: bridge
