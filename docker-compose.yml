  #   command: uv run uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
  #   networks:
  #     - processa-network
  #   depends_on:
  #     - ai-jobs-api

  # n8n - Workflow engine
  n8n:
    image: n8nio/n8n:latest
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=${N8N_HOST:-localhost}
      - N8N_PORT=${N8N_PORT:-5678}
      - N8N_PROTOCOL=${N8N_PROTOCOL:-http}
      - N8N_BASIC_AUTH_ACTIVE=${N8N_BASIC_AUTH_ACTIVE:-false}
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER:-}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD:-}
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE:-America/Sao_Paulo}

      - N8N_RUNNERS_ENABLED=true
      - N8N_RUNNERS_MODE=external
      - N8N_RUNNERS_BROKER_LISTEN_ADDRESS=0.0.0.0
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-changeme}
      - N8N_NATIVE_PYTHON_RUNNER=true
    volumes:
      - 'D:\Docker\n8n_data:/home/node/.n8n'
    networks:
      - processa-network
  
  # n8n runners - Executores externos
  n8n-runners:
    image: n8nio/runners:latest
    environment:
      - N8N_RUNNERS_TASK_BROKER_URI=http://n8n:5679
      - N8N_RUNNERS_AUTH_TOKEN=${N8N_RUNNERS_AUTH_TOKEN:-changeme}
      - N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT=${N8N_RUNNERS_AUTO_SHUTDOWN_TIMEOUT:-0}
    networks:
      - processa-network
    depends_on:
      - n8n

  # AI Jobs API - FastAPI (serviço interno)
  ai-jobs-api:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    ports:
      - "8001:8001"
    environment:
      - AI_WORKER_INTERNAL_TOKEN=${AI_WORKER_INTERNAL_TOKEN:-changeme}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JOBS_QUEUE_KEY=${JOBS_QUEUE_KEY:-jobs}
      - JOB_STATUS_TTL_S=${JOB_STATUS_TTL_S:-86400}
      - N8N_CNIS_WORKFLOW_ID=${N8N_CNIS_WORKFLOW_ID}
    networks:
      - processa-network
    depends_on:
      - redis
      - n8n

  # Calc Engine - FastAPI (serviço interno síncrono)
  calc-engine:
    build:
      context: ./services/calc-engine
      dockerfile: Dockerfile
    ports:
      - "8002:8002"
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-development}
      - CALC_ENGINE_INTERNAL_TOKEN=${CALC_ENGINE_INTERNAL_TOKEN:-changeme}
      - DATABASE_URL=${DATABASE_URL}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_OUTPUTS_BUCKET=${SUPABASE_OUTPUTS_BUCKET}
    networks:
      - processa-network

  # ai-jobs-worker - Worker do AI Jobs API
  ai-jobs-worker:
    build:
      context: ./services/ai-worker
      dockerfile: Dockerfile
    command: python -m src.worker
    environment:
      - AI_WORKER_INTERNAL_TOKEN=${AI_WORKER_INTERNAL_TOKEN:-changeme}
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - JOBS_QUEUE_KEY=${JOBS_QUEUE_KEY:-jobs}
      - JOB_STATUS_TTL_S=${JOB_STATUS_TTL_S:-86400}
      - N8N_BASE_URL=http://n8n:5678
      - N8N_CNIS_WORKFLOW_ID=${N8N_CNIS_WORKFLOW_ID}
      - N8N_FILE_FIELD_NAME=${N8N_FILE_FIELD_NAME:-data}
      - N8N_AUTH_USER=${N8N_AUTH_USER}
      - N8N_AUTH_PASSWORD=${N8N_AUTH_PASSWORD}
      - N8N_TIMEOUT_S=${N8N_TIMEOUT_S:-120}
      - SUPABASE_URL=${SUPABASE_URL}
      - SUPABASE_SERVICE_ROLE_KEY=${SUPABASE_SERVICE_ROLE_KEY}
      - SUPABASE_OUTPUTS_BUCKET=${SUPABASE_OUTPUTS_BUCKET}
    networks:
      - processa-network
    depends_on:
      - redis
      - n8n

networks:
  processa-network:
    driver: bridge
