[project]
name = "core-api"
version = "0.1.0"
description = "Core API for Processa AI - profiles, billing, content"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "supabase>=2.0.0",
    "stripe>=8.0.0",
    "python-multipart>=0.0.12",
    "alembic>=1.13.0",
    "python-dotenv>=1.0.0",
    "psycopg[binary]>=3.1.0",
    "sqlalchemy>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
