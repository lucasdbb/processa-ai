[project]
name = "processa-ai-office-api"
version = "1.0.0"
description = "Office API service for Processa AI - Calendar and Google integration"
authors = [{name = "Processa AI Team"}]
readme = { text = "Processa AI - Office API", content-type = "text/markdown" }
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.34.0",
    "pydantic>=2.10.5",
    "httpx>=0.28.1",
    "python-dotenv>=1.0.0",
    "psycopg[binary,pool]>=3.2.4",
    "redis>=5.0.8",
    "cryptography>=44.0.0",
    "google-auth>=2.38.0",
    "google-auth-oauthlib>=1.2.1",
    "alembic>=1.18.1",
    "sqlalchemy>=2.0.46",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.1",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".git", "__pycache__", ".venv", "venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]
