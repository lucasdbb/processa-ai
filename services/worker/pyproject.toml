[project]
name = "processa-ai-worker"
version = "1.0.0"
description = "Processa AI - Async Job Worker"
authors = [{name = "Processa AI Team"}]
readme = { text = "Processa AI - Worker", content-type = "text/markdown" }
requires-python = ">=3.13"
dependencies = [
    # Async & HTTP
    "httpx>=0.28.1",
    "pydantic>=2.10.5",
    "pydantic-settings>=2.0.0",
    # Database
    "psycopg[binary,pool]>=3.2.4",
    # Supabase
    "supabase>=2.0.0",
    # AI Providers (replaces n8n)
    "mistralai>=2.0.0",
    "google-genai>=1.66.0",
    # Google Integration (for office jobs)
    "google-auth>=2.38.0",
    "google-auth-oauthlib>=1.2.1",
    "cryptography>=44.0.0",
    # HTML Parsing (for RAG URL ingestion)
    "beautifulsoup4>=4.12.0",
    # PDF native text extraction (free, no API cost)
    "pymupdf>=1.25.0",
    # PDF / Document Generation
    "markdown-pdf==1.10",
    "docxtpl>=0.19.0",
    # Utils
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.4",
    "pytest-asyncio>=0.25.2",
    "pytest-cov>=6.0.0",
    "ruff>=0.9.1",
]

[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py313"
exclude = [".git", "__pycache__", ".venv", "venv", "dist", "build"]

[tool.ruff.lint]
select = ["E", "W", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

